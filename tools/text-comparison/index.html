<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A tool to compare two texts and highlight differences with customizable ignore options">
    <title>Text Comparison Tool &middot; Utility Pages</title>
    <link rel="icon" href="../../shared/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../../shared/styles.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <nav class="page-nav" aria-label="Breadcrumb">
            <a href="../../index.html" class="back-link">&#8592; All utilities</a>
        </nav>

        <h1>Text Comparison Tool</h1>

        <form id="comparisonForm">
            <div class="input-section">
                <div class="text-container">
                    <h2 class="section-label"><label for="text1">Text 1</label></h2>
                    <textarea id="text1" name="text1" placeholder="Enter first text here..." rows="10"></textarea>
                </div>
                <div class="text-container">
                    <h2 class="section-label"><label for="text2">Text 2</label></h2>
                    <textarea id="text2" name="text2" placeholder="Enter second text here..." rows="10"></textarea>
                </div>
            </div>

            <fieldset class="options-section">
                <legend class="sr-only">Comparison Options</legend>
                <div class="option">
                    <input type="checkbox" id="ignoreCase" name="ignoreCase" checked>
                    <label for="ignoreCase">Ignore Case</label>
                </div>
                <div class="option">
                    <input type="checkbox" id="ignoreSpaces" name="ignoreSpaces" checked>
                    <label for="ignoreSpaces">Ignore Spaces</label>
                </div>
                <div class="option">
                    <input type="checkbox" id="ignoreLineFeeds" name="ignoreLineFeeds" checked>
                    <label for="ignoreLineFeeds">Ignore Line Feeds</label>
                </div>
                <div class="option">
                    <input type="checkbox" id="ignoreEscapeSequences" name="ignoreEscapeSequences" checked>
                    <label for="ignoreEscapeSequences">Ignore Escape Sequences (e.g., \n, \", \t)</label>
                </div>
            </fieldset>

            <button type="submit" class="compare-btn" id="compareBtn">Compare Texts</button>
        </form>

        <div class="loading-spinner" id="loadingSpinner" role="status" aria-live="polite">
            <div class="spinner" aria-hidden="true"></div>
            <p>Processing comparison...</p>
        </div>

        <div class="results-section" id="resultsSection">
            <div class="status-message" id="statusMessage" role="status"></div>

            <div class="result-container">
                <div class="result-header">
                    <h3 class="section-label">Text 1</h3>
                    <div class="result-header-side">
                        <h3 class="section-label">Text 2</h3>
                        <div class="panel-navigation">
                            <button type="button" class="nav-btn-small" id="prevDiffBtn" aria-label="Go to previous difference" title="Previous difference (↑)">
                                <span aria-hidden="true">&#8593;</span>
                            </button>
                            <span class="diff-counter-small" id="diffCounter" aria-live="polite">-</span>
                            <button type="button" class="nav-btn-small" id="nextDiffBtn" aria-label="Go to next difference" title="Next difference (↓)">
                                <span aria-hidden="true">&#8595;</span>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="result-text" id="result" tabindex="0" role="group" aria-label="Comparison result, the two texts side by side. Use the up and down arrow keys to step through differences."></div>
            </div>
        </div>
    </main>

    <script type="module" src="main.js"></script>
</body>
</html>
